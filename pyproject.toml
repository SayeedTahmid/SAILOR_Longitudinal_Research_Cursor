[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "sailor-longitudinal-research"
version = "0.1.0"
description = "Auditable treatment-aware longitudinal brain MRI research pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "nibabel==5.3.2",
    "numpy==2.2.6",
    "PyYAML==6.0.2",
]

[project.optional-dependencies]
dev = [
    "nbformat==5.10.4",
    "pytest==8.4.1",
]

[project.scripts]
sailor-audit = "sailor.data.audit:main"

[tool.setuptools.packages.find]
include = ["sailor*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
